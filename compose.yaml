services:
  postgres:
    image: postgres:16.4-alpine
    container_name: altravel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-altravel}
      POSTGRES_USER: ${POSTGRES_USER:-altravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altravel_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-altravel} -d ${POSTGRES_DB:-altravel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: altravel_postgres_data
